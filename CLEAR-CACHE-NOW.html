<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clear Cache & Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #667eea; margin-top: 0; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            font-weight: 600;
        }
        button:hover {
            background: #5568d3;
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔧 Fix Login Issue</h1>
        <div class="info">
            <p><strong>The issue:</strong> Browser cache is preventing login.</p>
            <p><strong>The fix:</strong> Clear all cached data and reload.</p>
        </div>
        <button onclick="clearAndLogin()">🗑️ Clear Cache & Login</button>
        <p style="color: #666; font-size: 14px;">This will clear localStorage and open login page</p>
    </div>

    <script>
        function clearAndLogin() {
            // Clear all storage
            localStorage.clear();
            sessionStorage.clear();
            
            // Clear IndexedDB if exists
            if (window.indexedDB) {
                indexedDB.databases().then(dbs => {
                    dbs.forEach(db => indexedDB.deleteDatabase(db.name));
                });
            }
            
            // Open frontend
            window.location.href = 'http://localhost:5173';
        }
        
        // Show what will be cleared
        window.addEventListener('load', () => {
            const items = Object.keys(localStorage);
            console.log('Will clear', items.length, 'localStorage items:', items);
        });
    </script>
</body>
</html>
