<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiyas Login Flow Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        h3 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>🔐 Qiyas Login Flow Tester</h1>
    
    <div style="background: #fff3cd; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
        <h3 style="margin-top: 0;">📋 Quick Browser Fix</h3>
        <p><strong>If login page doesn't work, run this in browser console (F12):</strong></p>
        <pre style="background: #fff; padding: 10px; border: 1px solid #ccc;">localStorage.clear(); location.reload();</pre>
    </div>
    
    <div class="test-section">
        <h3>1. Backend Health Check</h3>
        <button onclick="testHealth()">Test Backend Health</button>
        <div id="health-result"></div>
    </div>

    <div class="test-section">
        <h3>2. Test Login Credentials</h3>
        <button onclick="testLogin('admin@university.edu', 'AdminPass123')">Admin</button>
        <button onclick="testLogin('dean@university.edu', 'DeanPass123')">Dean</button>
        <button onclick="testLogin('consultant@qiyas.sa', 'ConsultPass123')">Consultant</button>
        <button onclick="testLogin('employee@test.com', 'UserPass123')">Employee</button>
        <div id="login-result"></div>
    </div>

    <div class="test-section">
        <h3>3. Test Auth/Me Endpoint</h3>
        <button onclick="testAuthMe()">Test Auth/Me (requires login first)</button>
        <div id="authme-result"></div>
    </div>

    <div class="test-section">
        <h3>4. Check CORS Headers</h3>
        <button onclick="testCORS()">Test CORS</button>
        <div id="cors-result"></div>
    </div>

    <script>
        let currentToken = null;

        async function testHealth() {
            const result = document.getElementById('health-result');
            result.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch('http://localhost:3001/health');
                const data = await response.json();
                result.innerHTML = `<p class="success">✅ Backend is healthy</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Backend not reachable: ${error.message}</p>`;
            }
        }

        async function testLogin(email, password) {
            const result = document.getElementById('login-result');
            result.innerHTML = `<p>Testing login for ${email}...</p>`;
            
            try {
                const response = await fetch('http://localhost:3001/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'http://localhost:5173'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    currentToken = data.data.accessToken;
                    result.innerHTML = `
                        <p class="success">✅ Login successful for ${email}</p>
                        <pre>${JSON.stringify(data.data.user, null, 2)}</pre>
                        <p>Token stored for auth/me test</p>
                    `;
                } else {
                    result.innerHTML = `<p class="error">❌ Login failed: ${JSON.stringify(data, null, 2)}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Request failed: ${error.message}</p>`;
            }
        }

        async function testAuthMe() {
            const result = document.getElementById('authme-result');
            
            if (!currentToken) {
                result.innerHTML = '<p class="error">❌ No token available. Login first!</p>';
                return;
            }
            
            result.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch('http://localhost:3001/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Origin': 'http://localhost:5173'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    result.innerHTML = `
                        <p class="success">✅ Token validation successful</p>
                        <pre>${JSON.stringify(data.data.user, null, 2)}</pre>
                    `;
                } else {
                    result.innerHTML = `<p class="error">❌ Validation failed: ${JSON.stringify(data, null, 2)}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Request failed: ${error.message}</p>`;
            }
        }

        async function testCORS() {
            const result = document.getElementById('cors-result');
            result.innerHTML = '<p>Testing CORS...</p>';
            
            try {
                const response = await fetch('http://localhost:3001/api/v1/auth/login', {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': 'http://localhost:5173',
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'content-type,authorization'
                    }
                });
                
                const allowOrigin = response.headers.get('Access-Control-Allow-Origin');
                const allowMethods = response.headers.get('Access-Control-Allow-Methods');
                const allowHeaders = response.headers.get('Access-Control-Allow-Headers');
                const allowCredentials = response.headers.get('Access-Control-Allow-Credentials');
                
                result.innerHTML = `
                    <p class="success">✅ CORS preflight responded (${response.status})</p>
                    <pre>Allow-Origin: ${allowOrigin}
Allow-Methods: ${allowMethods}
Allow-Headers: ${allowHeaders}
Allow-Credentials: ${allowCredentials}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<p class="error">❌ CORS test failed: ${error.message}</p>`;
            }
        }

        // Run health check on load
        window.addEventListener('load', testHealth);
    </script>
</body>
</html>
