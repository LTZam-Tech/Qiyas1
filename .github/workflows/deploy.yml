# Production deploy (N6, NC5, CI-11, CI-12; decision D-N6-1).
#
# Manual trigger only. The operator passes the ID of a successful CI run for the commit being
# deployed; the job refuses to start unless that run is the CI workflow, on main, for exactly
# this commit, and finished with success.
#
# The droplet runs the deploy/ stack (COMPOSE_FILE is set in /opt/qiyas/deploy/.env), never the
# repository-root docker-compose.yml.
#
# Required secrets (environment "production", which must have required reviewers):
#   DEPLOY_HOST      host name or IP of the droplet (not hard-coded here)
#   DEPLOY_USER      SSH user (the non-root deploy user)
#   DEPLOY_SSH_KEY   private key of that user (restrict it in authorized_keys, see the PR notes)
#   DEPLOY_HOST_KEY  the droplet's known_hosts line(s), e.g. the output of
#                    `ssh-keyscan -t ed25519 <host>` taken on a trusted path and checked against
#                    the fingerprint shown on the droplet console
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "ID of the successful CI workflow run for the commit at the tip of main (Actions > CI > run URL)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$CI_RUN_ID" in
            ''|*[!0-9]*) echo "ci_run_id must be a numeric run ID" >&2; exit 1 ;;
          esac
          info="$(gh run view "$CI_RUN_ID" --json workflowName,headBranch,headSha,status,conclusion,event \
            --jq '[.workflowName, .headBranch, .headSha, .status, .conclusion, .event] | @tsv')"
          IFS=$'\t' read -r wf branch sha status conclusion event <<< "$info"
          echo "CI run $CI_RUN_ID: workflow=$wf branch=$branch sha=$sha status=$status conclusion=$conclusion event=$event"
          [ "$wf" = "CI" ]                || { echo "Run $CI_RUN_ID is not the CI workflow" >&2; exit 1; }
          [ "$branch" = "main" ]          || { echo "Run $CI_RUN_ID is not on main" >&2; exit 1; }
          [ "$event" = "push" ]           || { echo "Run $CI_RUN_ID was not triggered by a push to main" >&2; exit 1; }
          [ "$sha" = "$EXPECTED_SHA" ]    || { echo "Run $CI_RUN_ID is for $sha, not $EXPECTED_SHA" >&2; exit 1; }
          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] \
                                          || { echo "Run $CI_RUN_ID did not succeed" >&2; exit 1; }

      - name: Install SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_SSH_KEY" ]  || { echo "DEPLOY_SSH_KEY is not set" >&2; exit 1; }
          [ -n "$DEPLOY_HOST_KEY" ] || { echo "DEPLOY_HOST_KEY is not set" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts_deploy"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts_deploy"

      - name: Deploy the deploy/ stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_HOST" ] || { echo "DEPLOY_HOST is not set" >&2; exit 1; }
          [ -n "$DEPLOY_USER" ] || { echo "DEPLOY_USER is not set" >&2; exit 1; }
          # The checked SHA is a 40-hex string from GitHub, safe to embed in the remote command.
          ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts_deploy" \
              -o GlobalKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -e; cd /opt/qiyas && git pull --ff-only && test \"\$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\" && cd deploy && docker compose up -d --build"

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts_deploy"
