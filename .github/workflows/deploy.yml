name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: 194.163.172.141
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/opt/qiyas"

            # Deploy the exact commit that passed CI; never follow a moving branch.
            cd "$APP_DIR"
            TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            git fetch origin "$TARGET_SHA"
            git checkout --detach "$TARGET_SHA"

            # Rebuild and restart
            docker compose --env-file .env.production build
            docker compose --env-file .env.production up -d

            # Wait and health check
            sleep 15
            curl -sf http://localhost:8000/health || echo "Health check pending"
