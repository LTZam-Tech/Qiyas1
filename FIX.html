<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quick Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #667eea;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Click to Fix Login</h1>
        <p>This will clear cache and open login page</p>
        <button onclick="fix()">FIX NOW</button>
    </div>
    <script>
        function fix() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'http://localhost:5173';
        }
    </script>
</body>
</html>
