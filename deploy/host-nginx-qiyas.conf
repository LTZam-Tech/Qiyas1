# Site for the server's OWN nginx when it already hosts other sites (landing pages).
# Copy to /etc/nginx/sites-available/qiyas, set server_name, enable, then let certbot add HTTPS:
#   ln -s /etc/nginx/sites-available/qiyas /etc/nginx/sites-enabled/qiyas
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d qiyas.iltizamtech.com
# Only this server_name is forwarded to Qiyas; the other sites are untouched.

server {
    listen 80;
    listen [::]:80;
    server_name qiyas.iltizamtech.com;

    # evidence files up to 50 MB, plus multipart overhead
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
