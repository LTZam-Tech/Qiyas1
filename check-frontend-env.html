<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Environment Check</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; }
        .check { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .warning { background: #fff3cd; border-color: #ffeeba; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; border-radius: 3px; }
        h3 { margin-top: 0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🔍 Frontend Environment Diagnostic</h1>
    
    <div id="status" class="check">
        <h3>Checking frontend environment...</h3>
        <button onclick="checkEnvironment()">Re-check Environment</button>
        <button onclick="testLogin()">Test Login Flow</button>
        <button onclick="clearCache()">Clear Cache & Reload</button>
    </div>

    <div id="results"></div>

    <script>
        async function checkEnvironment() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Fetching frontend environment...</p>';
            
            try {
                // Fetch the frontend page
                const response = await fetch('http://localhost:5173');
                const html = await response.text();
                
                // Extract script tags to see what's being loaded
                const scripts = html.match(/<script[^>]*>(.*?)<\/script>/gs) || [];
                const hasViteClient = html.includes('/@vite/client');
                
                // Check localStorage
                const accessToken = localStorage.getItem('qiyas_access_token');
                const mockUser = localStorage.getItem('qiyas_mock_user');
                const errorLogs = JSON.parse(localStorage.getItem('qiyas_error_logs') || '[]');
                
                let html_report = '<div class="check">';
                html_report += '<h3>📦 Frontend Status</h3>';
                html_report += `<p><strong>Vite Dev Server:</strong> ${response.ok ? '✅ Running' : '❌ Not responding'}</p>`;
                html_report += `<p><strong>Vite HMR:</strong> ${hasViteClient ? '✅ Active' : '❌ Not loaded'}</p>`;
                html_report += '</div>';
                
                html_report += '<div class="check">';
                html_report += '<h3>🔐 Authentication State</h3>';
                html_report += `<p><strong>Access Token:</strong> ${accessToken ? '✅ Present (' + accessToken.substring(0, 20) + '...)' : '❌ None'}</p>`;
                html_report += `<p><strong>Mock User:</strong> ${mockUser ? '⚠️ Present (mock mode active)' : '✅ None'}</p>`;
                html_report += '</div>';
                
                html_report += '<div class="check ' + (errorLogs.length > 0 ? 'error' : 'success') + '">';
                html_report += '<h3>🐛 Error Logs</h3>';
                html_report += `<p><strong>Total Errors:</strong> ${errorLogs.length}</p>`;
                
                if (errorLogs.length > 0) {
                    html_report += '<p><strong>Most Recent Errors:</strong></p>';
                    html_report += '<pre>' + JSON.stringify(errorLogs.slice(-5), null, 2) + '</pre>';
                } else {
                    html_report += '<p>✅ No errors logged</p>';
                }
                html_report += '</div>';
                
                // Now check what environment config is ACTUALLY in the browser
                html_report += '<div class="check warning">';
                html_report += '<h3>⚙️ Environment Configuration Test</h3>';
                html_report += '<p>Opening frontend to check actual runtime config...</p>';
                html_report += '<p><strong>To check manually:</strong></p>';
                html_report += '<ol>';
                html_report += '<li>Open http://localhost:5173 in your browser</li>';
                html_report += '<li>Open DevTools (F12)</li>';
                html_report += '<li>Check Console for "📋 Environment Configuration" log</li>';
                html_report += '<li>Look for: useMockApi value</li>';
                html_report += '</ol>';
                html_report += '</div>';
                
                results.innerHTML = html_report;
                
            } catch (error) {
                results.innerHTML = `<div class="check error"><h3>❌ Error</h3><pre>${error.message}</pre></div>`;
            }
        }
        
        async function testLogin() {
            const results = document.getElementById('results');
            const testDiv = document.createElement('div');
            testDiv.className = 'check';
            testDiv.innerHTML = '<h3>🔐 Testing Login Flow...</h3>';
            results.appendChild(testDiv);
            
            try {
                const loginBody = {
                    email: 'admin@university.edu',
                    password: 'AdminPass123'
                };
                
                const response = await fetch('http://localhost:3001/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'http://localhost:5173'
                    },
                    body: JSON.stringify(loginBody)
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    testDiv.className = 'check success';
                    testDiv.innerHTML += '<p>✅ Backend Login Successful</p>';
                    testDiv.innerHTML += '<pre>' + JSON.stringify(data.data.user, null, 2) + '</pre>';
                    testDiv.innerHTML += '<p><strong>Token:</strong> ' + data.data.accessToken.substring(0, 30) + '...</p>';
                } else {
                    testDiv.className = 'check error';
                    testDiv.innerHTML += '<p>❌ Backend Login Failed</p>';
                    testDiv.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                }
            } catch (error) {
                testDiv.className = 'check error';
                testDiv.innerHTML += '<p>❌ Request Failed: ' + error.message + '</p>';
            }
        }
        
 function clearCache() {
            if (confirm('This will clear all localStorage data and reload. Continue?')) {
                localStorage.clear();
                sessionStorage.clear();
                alert('Cache cleared! Page will reload.');
                window.location.href = 'http://localhost:5173';
            }
        }
        
        // Auto-run on load
        window.addEventListener('load', checkEnvironment);
    </script>
</body>
</html>
